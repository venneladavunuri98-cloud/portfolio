<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .d { fill: #0b0b0b; }
    .p { stroke: #0b0b0b; }
    @media (prefers-color-scheme: dark) {
      .d { fill: #f2f2f2; }
      .p { stroke: #f2f2f2; }
    }
  </style>
  <defs>
    <linearGradient id="peel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#7a7a7a"/>
    </linearGradient>
    <clipPath id="cut">
      <polygon points="-70,-70 25,-70 65,-30 70,-25 70,70 -70,70"/>
    </clipPath>
  </defs>
  <g class="d" transform="translate(256,256) scale(1.26) translate(-256,-256)">
    <rect x="-65" y="-65" width="130" height="130" rx="26" transform="translate(256,157) rotate(45)"/>
    <rect x="-65" y="-65" width="130" height="130" rx="26" transform="translate(157,256) rotate(45)"/>
    <rect x="-65" y="-65" width="130" height="130" rx="26" transform="translate(355,256) rotate(45)"/>
    <g transform="translate(256,355) rotate(45)">
      <rect x="-65" y="-65" width="130" height="130" rx="26" clip-path="url(#cut)"/>
      <polygon class="p" points="25,-65 65,-25 25,-25" fill="url(#peel)" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
